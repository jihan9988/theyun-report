<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>월 정산</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* Layout: an account ledger. A dark header band carries the four totals; below, the statement (left) reads top to bottom
   like a P&L, and a narrow side column (right) holds the comparison chart, month history and tools. */
:root{
  --band:#121a2b; --band-2:#1c2740; --band-ink:#f2f4f9; --band-mute:#9aa6c0;
  --bg:#eef0f4; --paper:#ffffff; --ink:#141922; --ink-2:#4b5263; --ink-3:#808799; --rule:#e2e5ec; --rule-2:#cfd4de; --tint:#f5f6f9;
  --gain:#17804d; --loss:#c53a30; --vat:#a26a00; --vat-soft:#fdf4e1; --accent:#2f4fd8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#e87ba4; --g1:#2c9a62; --g2:#7fcfa3;
  --f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --band:#0b1020; --band-2:#162037; --band-ink:#eef1f8; --band-mute:#8f9ab3;
  --bg:#0e1118; --paper:#161a23; --ink:#e9ecf2; --ink-2:#b3b9c7; --ink-3:#8a90a0; --rule:#262b37; --rule-2:#343a48; --tint:#1c212c;
  --gain:#4cc283; --loss:#f07a70; --vat:#e2ae45; --vat-soft:#2a2214; --accent:#8496ff;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#d55181; --g1:#3fb877; --g2:#2b7a50; color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#0b1020; --band-2:#162037; --band-ink:#eef1f8; --band-mute:#8f9ab3;
  --bg:#0e1118; --paper:#161a23; --ink:#e9ecf2; --ink-2:#b3b9c7; --ink-3:#8a90a0; --rule:#262b37; --rule-2:#343a48; --tint:#1c212c;
  --gain:#4cc283; --loss:#f07a70; --vat:#e2ae45; --vat-soft:#2a2214; --accent:#8496ff;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#d55181; --g1:#3fb877; --g2:#2b7a50; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.band{background:var(--band);color:var(--band-ink)}
.band .in{padding-block:26px 28px;display:grid;gap:22px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--band-mute);font-weight:600}
h1{margin:4px 0 0;font-size:clamp(24px,3.6vw,32px);font-weight:800;letter-spacing:-.02em}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.months{display:flex;gap:2px;background:var(--band-2);border-radius:10px;padding:3px}
.months button{border:0;background:transparent;color:var(--band-mute);font:600 13px var(--f);padding:6px 14px;border-radius:8px;cursor:pointer}
.months button[aria-pressed="true"]{background:var(--band-ink);color:var(--band)}
.live{font-size:12px;color:var(--band-mute);display:flex;gap:6px;align-items:center}
.live i{width:7px;height:7px;border-radius:50%;background:#4cc283}
.live.stale i{background:#e2ae45}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--band-2);border-radius:12px;overflow:hidden}
.kpi{background:var(--band);padding:14px 16px;min-width:0}
.kpi small{display:block;font-size:12px;color:var(--band-mute);font-weight:600}
.kpi b{display:block;font-size:clamp(19px,2.4vw,26px);font-weight:750;letter-spacing:-.01em;margin-top:2px}
.kpi span{display:block;font-size:12px;color:var(--band-mute);margin-top:2px}
.kpi.net b.pos{color:#5fd497} .kpi.net b.neg{color:#ff8f86} .kpi.vat b{color:#f1c26a}
main .in{padding-block:20px 64px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.paper{background:var(--paper);border:1px solid var(--rule);border-radius:12px;min-width:0}
.ledger{padding:6px 0 14px}
.sec{padding:16px 20px 6px}
.sec+.sec{border-top:1px solid var(--rule)}
.sec h2{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:7px 0;align-items:baseline}
.row .what{min-width:0}
.row .what em{font-style:normal;color:var(--ink-3);font-size:12px;margin-left:6px}
.row .sub{grid-column:1/-1;font-size:12px;color:var(--ink-3);margin-top:-4px}
.row.item{padding-left:17px;font-size:14px;color:var(--ink-2)}
.row.item .amt{color:var(--ink)}
.row.group{border-top:1px solid var(--rule);margin-top:6px;padding-top:10px;font-weight:700}
.row.group .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px}
.row.total{border-top:1.5px solid var(--ink);margin-top:8px;padding-top:10px;font-weight:800;font-size:16px}
.row.result{background:var(--tint);margin:10px -20px 0;padding:14px 20px;font-size:18px;font-weight:800}
.amt{text-align:right}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.chip.plan{background:var(--vat-soft);color:var(--vat)} .chip.sms{background:var(--tint);color:var(--ink-3);border:1px solid var(--rule)} .chip.cancel{color:var(--loss);border:1px solid var(--loss)}
.vatbox{margin:14px 20px 0;background:var(--vat-soft);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-weight:700}
.vatbox b{color:var(--vat)} .vatbox p{grid-column:1/-1;margin:0;font-size:12px;color:var(--ink-2);font-weight:400}
.dep{width:100%;border-collapse:collapse;font-size:14px}
.dep th,.dep td{padding:7px 0 7px 12px;border-bottom:1px solid var(--rule);text-align:right}
.dep th:first-child,.dep td:first-child{text-align:left;padding-left:0}
.dep th{font-size:12px;color:var(--ink-3);font-weight:600}
.dep td.vatc{color:var(--vat)}
.dep tr.sum td{font-weight:800;border-bottom:0}
.scroll{overflow-x:auto}
aside{display:grid;gap:18px;min-width:0}
.card{padding:16px 18px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700}
.hbar{display:grid;gap:4px;margin-bottom:12px}
.hbar .l{display:flex;justify-content:space-between;font-size:13px}
.track{display:flex;gap:2px;height:16px;background:var(--tint);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%}
.legend{display:grid;gap:4px;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend>span{display:flex;justify-content:space-between;gap:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.hist{width:100%;border-collapse:collapse;font-size:13px}
.hist th,.hist td{padding:6px 0 6px 8px;text-align:right;border-bottom:1px solid var(--rule)}
.hist th:first-child,.hist td:first-child{text-align:left;padding-left:0}
.hist th{font-size:12px;color:var(--ink-3);font-weight:600}
.hist tr.cur td{font-weight:700}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.note{font-size:12px;color:var(--ink-3);margin:8px 0 0}
.warn{font-size:13px;color:var(--vat);background:var(--vat-soft);border-radius:8px;padding:8px 10px;margin:0 0 10px}
form.add{display:grid;gap:8px}
form.add .two{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px}
label{display:grid;gap:3px;font-size:12px;color:var(--ink-3);font-weight:600}
input,select{font:14px var(--f);color:var(--ink);background:var(--tint);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
button.primary{font:700 14px var(--f);background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px;cursor:pointer}
button.copy{font:600 12px var(--f);background:transparent;color:var(--accent);border:1px solid var(--rule-2);border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.link{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px}
.link code{background:var(--tint);border-radius:6px;padding:6px 8px;overflow-x:auto;white-space:nowrap}
a{color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gate{padding:20vh 16px;text-align:center;color:var(--ink-2)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 10px;border-radius:8px;z-index:30;white-space:nowrap}
@media (max-width:900px){main .in{grid-template-columns:minmax(0,1fr)} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body>
<div id="app"><div class="gate">정산을 불러오는 중입니다…</div></div>
<div class="tip" id="tip" hidden></div>
<script>
// Live monthly settlement. The access key follows "#k=" in the link; the server decides what each key may see.
var API = 'https://script.google.com/macros/s/AKfycbxcDlpSAjeZ5M0-CAH3cxW7B_xkXASHOGtLPvw0mD_sLq8BuhNsg9qK1E4WsgI-7uYBdg/exec';
var KEY = (location.hash.match(/k=([A-Za-z0-9]+)/) || [])[1] || '';
var FIRST_MONTH = '2026-10';
var state = { month: null, data: {}, role: null, at: 0, links: null };
var won = function (n) { n = Math.round(n || 0); return (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('ko-KR') + '원'; };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
function months() {
  var out = [], d = new Date(FIRST_MONTH + '-01T12:00:00+09:00'), now = new Date();
  while (d <= now) { out.push(d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2)); d.setMonth(d.getMonth() + 1); }
  return out;
}
function api(q) { return fetch(API + '?api=settle&v=' + KEY + q, { cache: 'no-store' }).then(function (r) { return r.json(); }); }
// One view model for both audiences. The staff view never receives names or per-person pay from the server.
function model(r) {
  var d = r.data, t = d.totals;
  if (r.role === 'staff') {
    return { staff: true, month: d.month, asOf: d.asOf, deposits: d.deposits, vat: t.vat || 0, adIn: t.adIn || 0, depositsTotal: t.depositsTotal,
      income: [{ name: '광고 대행 수수료 (15%)', won: t.fees || 0, c: 'var(--g1)' }, { name: '광고 운영 수익', won: t.margin || 0, c: 'var(--g2)' }],
      groups: [{ label: '팀 운영비', won: t.team, items: null, c: 'var(--s1)' }, { label: '업무 도구 구독', won: t.subs, items: d.subs, c: 'var(--s2)' }, { label: '기타 지출', won: t.extra, items: d.extras, c: 'var(--s3)' }],
      incomeSum: t.income, spend: t.spend, net: t.net };
  }
  return { staff: false, raw: d, month: d.month, asOf: d.asOf, deposits: d.deposits.map(function (x) { return { name: x.name, memo: x.memo, ad: x.won, fee: x.fee, vat: x.vat, won: x.won + x.fee + x.vat }; }),
    vat: t.vat, adIn: t.adIn, depositsTotal: t.depositsTotal,
    income: [{ name: '광고 대행 수수료 (15%)', won: t.fees, c: 'var(--g1)' }, { name: '더윤 광고비 차익', won: d.margin.margin, c: 'var(--g2)', sub: '리포트 광고비 ' + won(d.margin.rep) + ' − 실제 광고비 ' + won(d.margin.real) }],
    groups: [{ label: '사람에게 지급', won: t.teamSum, items: d.team, c: 'var(--s1)' }, { label: '구독', won: t.subsSum, items: d.subs, c: 'var(--s2)' },
             { label: '추가 결제', won: t.extraSum, items: d.extras, c: 'var(--s3)' }, { label: '기타 이체', won: t.sentSum, items: d.sent, c: 'var(--s4)' }].filter(function (g) { return g.won || (g.items && g.items.length); }),
    incomeSum: t.income, spend: t.spend, net: t.net };
}
function itemRow(x, rate) {
  var chips = '';
  if (x.status === '예정') chips += '<span class="chip plan">결제 예정</span>';
  if (x.status === '자동') chips += '<span class="chip sms">문자</span>';
  if (x.won < 0) chips += '<span class="chip cancel">취소</span>';
  var amt = x.won == null ? '<span style="color:var(--vat)">금액 확인 필요</span>' : won(x.won);
  var sub = x.usd != null && x.usd !== '' && rate ? '<div class="sub">$' + Number(x.usd).toFixed(2) + ' × ' + rate.toLocaleString('ko-KR') + '원 (오늘 환율)</div>' : '';
  return '<div class="row item"' + (x.status === '예정' ? ' style="opacity:.6"' : '') + '><div class="what">' + esc(x.name) + chips + (x.date ? '<em>' + esc(x.date) + '</em>' : '') + '</div><div class="amt n">' + amt + '</div>' + sub + '</div>';
}
function render() {
  var r = state.data[state.month]; if (!r) return;
  var m = model(r), mo = Number(m.month.slice(5)), rate = m.staff ? 0 : m.raw.rate;
  document.title = mo + '월 정산' + (m.staff ? '' : ' · 사장님');
  var h = '';
  h += '<header class="band"><div class="in"><div class="top"><div><div class="eyebrow">' + (m.staff ? '팀 회의용' : '사장님 전용 · 전체 공개') + '</div><h1>' + m.month.slice(0, 4) + '년 ' + mo + '월 정산</h1></div>' +
    '<div class="right"><div class="months" role="group" aria-label="달 선택">' + months().map(function (k) { return '<button type="button" data-m="' + k + '" aria-pressed="' + (k === state.month) + '">' + Number(k.slice(5)) + '월</button>'; }).join('') + '</div>' +
    '<div class="live" id="live"><i></i>' + esc(m.asOf) + ' 기준 · 1분마다 갱신</div></div></div>' +
    '<div class="kpis">' +
    '<div class="kpi"><small>번 돈</small><b class="n">' + won(m.incomeSum) + '</b><span>수수료 + ' + (m.staff ? '광고 운영 수익' : '광고비 차익') + '</span></div>' +
    '<div class="kpi"><small>나간 돈</small><b class="n">' + won(m.spend) + '</b><span>' + m.groups.map(function (g) { return g.label; }).join(' · ') + '</span></div>' +
    '<div class="kpi net"><small>순이익</small><b class="n ' + (m.net >= 0 ? 'pos' : 'neg') + '">' + (m.net > 0 ? '+' : '') + won(m.net) + '</b><span>' + (m.net >= 0 ? '흑자' : '적자') + ' · 부가세 제외</span></div>' +
    '<div class="kpi vat"><small>부가세 (따로 보관)</small><b class="n">' + won(m.vat) + '</b><span>신고 때 낼 돈</span></div>' +
    '</div></div></header>';
  h += '<main><div class="in"><div class="paper ledger">';
  h += '<section class="sec"><h2>1. 광고주에게 받은 돈</h2><div class="scroll"><table class="dep"><tr><th>입금</th><th>광고비</th><th>수수료</th><th>부가세</th><th>합계</th></tr>' +
    m.deposits.map(function (x) { return '<tr><td>' + esc(x.name) + (x.memo ? '<div class="note" style="margin:0">' + esc(x.memo) + '</div>' : '') + '</td><td class="n">' + won(x.ad) + '</td><td class="n">' + won(x.fee) + '</td><td class="n vatc">' + won(x.vat) + '</td><td class="n">' + won(x.won) + '</td></tr>'; }).join('') +
    '<tr class="sum"><td>합계</td><td class="n">' + won(m.adIn) + '</td><td class="n">' + won(m.income[0].won) + '</td><td class="n vatc">' + won(m.vat) + '</td><td class="n">' + won(m.depositsTotal) + '</td></tr></table></div>' +
    '<p class="note">광고비는 광고에 다시 쓰는 돈이고, 부가세는 나중에 낼 돈입니다. 우리 몫은 수수료입니다.</p></section>';
  h += '<section class="sec"><h2>2. 번 돈</h2>' + m.income.map(function (x) { return '<div class="row"><div class="what">' + esc(x.name) + '</div><div class="amt n">' + won(x.won) + '</div>' + (x.sub ? '<div class="sub">' + esc(x.sub) + '</div>' : '') + '</div>'; }).join('') +
    '<div class="row total"><div>번 돈 합계</div><div class="amt n">' + won(m.incomeSum) + '</div></div></section>';
  h += '<section class="sec"><h2>3. 나간 돈</h2>';
  m.groups.forEach(function (g) {
    h += '<div class="row group"><div class="what"><span class="dot" style="background:' + g.c + '"></span>' + esc(g.label) + '</div><div class="amt n">' + won(g.won) + '</div></div>';
    if (g.items) g.items.slice().sort(function (a, b) { return (b.won || 0) - (a.won || 0); }).forEach(function (x) { h += itemRow(x, rate); });
  });
  h += '<div class="row total"><div>나간 돈 합계</div><div class="amt n">' + won(m.spend) + '</div></div></section>';
  h += '<section class="sec"><h2>4. 결과</h2><div class="row"><div>번 돈</div><div class="amt n">' + won(m.incomeSum) + '</div></div><div class="row"><div>나간 돈</div><div class="amt n">− ' + won(m.spend) + '</div></div>' +
    '<div class="row result"><div>' + mo + '월 순이익</div><div class="amt n ' + (m.net >= 0 ? 'pos' : 'neg') + '">' + (m.net > 0 ? '+' : '') + won(m.net) + '</div></div></section>';
  h += '<div class="vatbox"><div>부가세 (순이익과 별도)</div><b class="n">' + won(m.vat) + '</b><p>광고주 입금에 들어 있던 부가세 10%입니다. 부가세 신고 때 내야 하는 돈이라 순이익 계산에서 뺐습니다.</p></div>';
  h += '</div><aside>' + compare(m) + history() + (m.staff ? '' : tools(m.raw)) + '</aside></div></main>';
  var app = document.getElementById('app'), keep = {};
  ['fDate', 'fName', 'fAmt', 'fKind'].forEach(function (id) { var el = document.getElementById(id); if (el) keep[id] = el.value; });
  app.innerHTML = h;
  Object.keys(keep).forEach(function (id) { var el = document.getElementById(id); if (el) el.value = keep[id]; });
}
// Earned vs spent on one scale, each bar split into its parts.
function compare(m) {
  var max = Math.max(m.incomeSum, m.spend, 1);
  var seg = function (parts) { return parts.filter(function (p) { return p.won > 0; }).map(function (p) { return '<i data-tip="' + esc(p.label || p.name) + ' ' + won(p.won) + '" style="width:' + (p.won / max * 100) + '%;background:' + p.c + '"></i>'; }).join(''); };
  return '<div class="paper card"><h3>번 돈과 나간 돈</h3>' +
    '<div class="hbar"><div class="l"><span>번 돈</span><b class="n">' + won(m.incomeSum) + '</b></div><div class="track">' + seg(m.income) + '</div></div>' +
    '<div class="hbar"><div class="l"><span>나간 돈</span><b class="n">' + won(m.spend) + '</b></div><div class="track">' + seg(m.groups) + '</div></div>' +
    '<div class="legend">' + m.income.concat(m.groups).filter(function (p) { return p.won; }).map(function (p) { return '<span><span><i style="background:' + p.c + '"></i>' + esc(p.label || p.name) + '</span><b class="n">' + won(p.won) + '</b></span>'; }).join('') + '</div></div>';
}
function history() {
  var ms = months().filter(function (k) { return state.data[k]; });
  if (ms.length < 2) return '';
  return '<div class="paper card"><h3>달별 결과</h3><div class="scroll"><table class="hist"><tr><th>달</th><th>번 돈</th><th>나간 돈</th><th>순이익</th></tr>' + ms.map(function (k) {
    var m = model(state.data[k]);
    return '<tr' + (k === state.month ? ' class="cur"' : '') + '><td>' + Number(k.slice(5)) + '월</td><td class="n">' + won(m.incomeSum) + '</td><td class="n">' + won(m.spend) + '</td><td class="n ' + (m.net >= 0 ? 'pos' : 'neg') + '">' + won(m.net) + '</td></tr>';
  }).join('') + '</table></div><p class="note">10월은 광고주 입금 기록이 없어 나간 돈만 있습니다.</p></div>';
}
function tools(d) {
  var h = '';
  if (state.links) {
    var staffUrl = location.origin + location.pathname + '#k=' + state.links.staffToken;
    h += '<div class="paper card"><h3>회의용 링크</h3><div class="link"><code>' + esc(staffUrl) + '</code><button class="copy" type="button" data-copy="' + esc(staffUrl) + '">복사</button></div><p class="note">사람별 지급액은 \'팀 운영비\' 합계로만 보입니다.</p></div>';
  }
  h += '<div class="paper card"><h3>직접 추가</h3>';
  if (d.unknown.length) h += '<p class="warn">금액을 모르는 항목: ' + d.unknown.map(esc).join(', ') + '</p>';
  if (d.totals.pending) h += '<p class="warn">결제 예정 구독 ' + won(d.totals.pending) + '은 결제 문자가 오면 나간 돈에 들어갑니다.</p>';
  h += '<form class="add" id="addForm"><div class="two"><label for="fDate">날짜<input id="fDate" placeholder="11/15" required></label><label for="fName">내용<input id="fName" placeholder="예: 우진님 12월분" required></label></div>' +
    '<div class="two"><label for="fKind">구분<select id="fKind"><option value="팀">사람 지급</option><option value="이체">기타 이체</option><option value="추가">추가 결제</option><option value="구독">구독</option><option value="입금">광고주 입금</option></select></label><label for="fAmt">금액 (원)<input id="fAmt" inputmode="numeric" placeholder="1,000,000" required></label></div>' +
    '<button class="primary" type="submit" id="fBtn">추가</button></form><p class="note" id="fMsg">문자가 오지 않는 이체나 결제를 넣는 곳입니다. 고치거나 지우려면 <a href="' + esc(d.sheet) + '" target="_blank" rel="noopener">정산 시트</a>를 여세요.</p></div>';
  return h;
}
function load(month) {
  state.month = month;
  return api('&month=' + month + (state.role === 'staff' || state.links ? '' : '&links=1')).then(function (r) {
    if (!r.ok) { document.getElementById('app').innerHTML = '<div class="gate">이 링크로는 정산을 볼 수 없습니다. 받은 링크 전체를 다시 열어 주세요.</div>'; return; }
    state.role = r.role; if (r.data.staffToken) state.links = { staffToken: r.data.staffToken };
    state.data[month] = r; state.at = Date.now(); render();
  }).catch(function () { var l = document.getElementById('live'); if (l) { l.classList.add('stale'); l.lastChild.textContent = ' 연결이 끊겨 잠시 후 다시 시도합니다'; } });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-m]'); if (b) { var k = b.getAttribute('data-m'); if (state.data[k]) { state.month = k; render(); } load(k); return; }
  var c = e.target.closest('[data-copy]');
  if (c) navigator.clipboard.writeText(c.getAttribute('data-copy')).then(function () { c.textContent = '복사됨'; }, function () { c.textContent = '길게 눌러 복사'; });
});
document.addEventListener('submit', function (e) {
  if (e.target.id !== 'addForm') return; e.preventDefault();
  var amt = Number(document.getElementById('fAmt').value.replace(/[^\d]/g, '')), btn = document.getElementById('fBtn'), msg = document.getElementById('fMsg');
  if (!amt) { msg.textContent = '금액을 숫자로 넣어 주세요.'; return; }
  var row = [state.month, document.getElementById('fKind').value, document.getElementById('fDate').value.trim(), document.getElementById('fName').value.trim(), amt, '', '', '', '정산 화면에서 추가', '', '', '확정'];
  btn.disabled = true; btn.textContent = '추가 중…';
  api('&rows=' + encodeURIComponent(JSON.stringify([row]))).then(function (r) {
    if (!r.ok) { btn.disabled = false; btn.textContent = '추가'; msg.textContent = '추가하지 못했습니다: ' + r.error; return; }
    ['fDate', 'fName', 'fAmt'].forEach(function (id) { document.getElementById(id).value = ''; });
    load(state.month);
  }).catch(function () { btn.disabled = false; btn.textContent = '추가'; msg.textContent = '연결이 끊겨 추가하지 못했습니다. 다시 눌러 주세요.'; });
});
(function () {
  var tip = document.getElementById('tip');
  document.addEventListener('pointermove', function (e) {
    var t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; }
    tip.textContent = t.getAttribute('data-tip'); tip.hidden = false;
    tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  });
})();
if (!KEY) document.getElementById('app').innerHTML = '<div class="gate">링크에 접근 키가 없습니다. 받은 링크 전체를 열어 주세요.</div>';
else {
  var ms = months(), cur = ms[ms.length - 1];
  load(cur).then(function () { ms.slice(0, -1).forEach(function (k) { api('&month=' + k).then(function (r) { if (r.ok) { state.data[k] = r; render(); } }); }); });
  setInterval(function () { var a = document.activeElement; if (!document.hidden && !(a && a.closest && a.closest('form'))) load(state.month); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - state.at > 30000) load(state.month); });
}
</script>
</body></html>
