<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>월 정산</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a ledger sheet — one wide summary band (net result + waterfall), then grouped detail panels in a 2-column grid. */
:root{
  --bg:#f3f4f7; --sheet:#ffffff; --ink:#151821; --ink-2:#4a5061; --ink-3:#7b8193; --rule:#e3e6ee; --tint:#eceef4;
  --accent:#2f47c8; --gain:#1c7c4a; --gain-soft:#e4f3ea; --loss:#c23a32; --loss-soft:#fbe9e7; --warn:#a86a00; --warn-soft:#fbf1dc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --vat:#c9ccd6;
  --f-display:"Space Grotesk","IBM Plex Sans KR",system-ui,sans-serif; --f-body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1117; --sheet:#171a22; --ink:#eceef3; --ink-2:#b4b9c6; --ink-3:#858b9b; --rule:#272b36; --tint:#1f232d;
  --accent:#8193ff; --gain:#4cc283; --gain-soft:#14281d; --loss:#f07a70; --loss-soft:#2c1715; --warn:#e2a93a; --warn-soft:#2a2112;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --vat:#4a4f5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1117; --sheet:#171a22; --ink:#eceef3; --ink-2:#b4b9c6; --ink-3:#858b9b; --rule:#272b36; --tint:#1f232d;
  --accent:#8193ff; --gain:#4cc283; --gain-soft:#14281d; --loss:#f07a70; --loss-soft:#2c1715; --warn:#e2a93a; --warn-soft:#2a2112;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --vat:#4a4f5c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
h1{margin:2px 0 0;font:700 clamp(26px,4vw,34px)/1.2 var(--f-body);text-wrap:balance}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.months{display:flex;gap:4px;background:var(--tint);padding:4px;border-radius:10px}
.months button{border:0;background:transparent;color:var(--ink-2);font:600 13px var(--f-body);padding:6px 12px;border-radius:7px;cursor:pointer}
.months button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.live{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--gain);display:inline-block}
.live.stale i{background:var(--warn)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:20px;min-width:0}
.band{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
.netlabel{font-size:13px;color:var(--ink-2);font-weight:600}
.net{font-size:clamp(38px,6.5vw,56px);font-weight:700;line-height:1.1;margin:4px 0 6px;padding-left:3px;letter-spacing:0}
.net.pos{color:var(--gain)} .net.neg{color:var(--loss)}
.netnote{font-size:13px;color:var(--ink-3)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pair div{border-radius:10px;padding:12px 14px}
.pair .in{background:var(--gain-soft)} .pair .out{background:var(--loss-soft)}
.pair small{display:block;font-size:12px;color:var(--ink-2);font-weight:600}
.pair b{font-size:22px;font-weight:700}
.pair .in b{color:var(--gain)} .pair .out b{color:var(--loss)}
.chart-title{font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
svg text{font-family:var(--f-body)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
h2{font-size:16px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 .num{font-size:16px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;position:relative}
.bar .lbl{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .lbl em{font-style:normal;color:var(--ink-3);font-size:12px;margin-left:6px}
.bar .val{font-size:13px;font-weight:600;text-align:right}
.bar .track{grid-column:1/-1;height:8px;background:var(--tint);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:0 4px 4px 0}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;vertical-align:1px}
.chip.plan{background:var(--warn-soft);color:var(--warn)} .chip.auto{background:var(--tint);color:var(--ink-2)} .chip.cancel{background:var(--loss-soft);color:var(--loss)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
tr.total td{font-weight:700;border-bottom:0}
.tbl{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{font-size:12px;color:var(--ink-3);margin:10px 0 0}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}
form.add{display:grid;grid-template-columns:110px minmax(0,1fr) 140px 120px auto;gap:8px;align-items:end}
form.add label{display:grid;gap:4px;font-size:12px;color:var(--ink-3);font-weight:600}
input,select{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
button.primary{font:600 14px var(--f-body);background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
button.ghost{font:600 13px var(--f-body);background:transparent;color:var(--accent);border:1px solid var(--rule);border-radius:8px;padding:7px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:13px}
.copyrow{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.copyrow code{background:var(--tint);padding:6px 8px;border-radius:6px;font-size:12px;overflow-x:auto;white-space:nowrap}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:8px;z-index:20;white-space:nowrap}
.gate{max-width:420px;margin:18vh auto;text-align:center;color:var(--ink-2)}
.loading{opacity:.55;transition:opacity .2s}
details.fold>summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between}
details.fold>summary::after{content:'펼치기';font-size:12px;color:var(--accent)}
details.fold[open]>summary::after{content:'접기'}
details.fold>summary::-webkit-details-marker{display:none}
body.staff .admin-only{display:none!important}
body.admin .staff-only{display:none!important}
@media (max-width:820px){.band,.grid2{grid-template-columns:minmax(0,1fr)} form.add{grid-template-columns:1fr 1fr} form.add .wide{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div class="wrap" id="app"><div class="gate" id="gate">정산을 불러오는 중입니다…</div></div>
<div class="tip" id="tip" hidden></div>
<script>
// Live monthly settlement. The link carries an access key after "#k="; the server decides what each key may see.
var API = 'https://script.google.com/macros/s/AKfycbxcDlpSAjeZ5M0-CAH3cxW7B_xkXASHOGtLPvw0mD_sLq8BuhNsg9qK1E4WsgI-7uYBdg/exec';
var KEY = (location.hash.match(/k=([A-Za-z0-9]+)/) || [])[1] || '';
var FIRST_MONTH = '2026-10';
var state = { month: null, data: {}, role: null, at: 0 };
var won = function (n) { return (n < 0 ? '−' : '') + Math.abs(Math.round(n || 0)).toLocaleString('ko-KR'); };
var man = function (n) { var v = Math.round((n || 0) / 10000); return (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('ko-KR') + '만'; };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
function months() {
  var out = [], d = new Date(FIRST_MONTH + '-01T12:00:00+09:00'), now = new Date();
  while (d <= now) { out.push(d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2)); d.setMonth(d.getMonth() + 1); }
  return out;
}
function api(q) {
  return fetch(API + '?api=settle&v=' + KEY + q, { cache: 'no-store' }).then(function (r) { return r.json(); });
}
// One view model for both audiences; the owner's labels are plain, the staff labels hide pay details.
function model(r) {
  var d = r.data, staff = r.role === 'staff';
  if (staff) {
    return { staff: true, month: d.month, asOf: d.asOf, income: d.income, depositsTotal: d.totals.depositsTotal, deposits: d.deposits,
      groups: [{ k: 'team', label: '팀 운영비', won: d.totals.team, items: [], c: 'var(--s1)' },
               { k: 'subs', label: '업무 도구 구독', won: d.totals.subs, items: d.subs, c: 'var(--s2)' },
               { k: 'extra', label: '기타 지출', won: d.totals.extra, items: d.extras, c: 'var(--s3)' }],
      incomeSum: d.totals.income, spend: d.totals.spend, net: d.totals.net };
  }
  var t = d.totals;
  return { staff: false, raw: d, month: d.month, asOf: d.asOf, depositsTotal: t.depositsTotal, deposits: d.deposits,
    income: [{ name: '대행 수수료 15%', won: t.fees }, { name: '더윤 광고비 차익', won: d.margin.margin }],
    groups: [{ k: 'team', label: '사람에게 지급', won: t.teamSum, items: d.team, c: 'var(--s1)' },
             { k: 'subs', label: '구독', won: t.subsSum, items: d.subs, c: 'var(--s2)' },
             { k: 'extra', label: '추가 결제', won: t.extraSum, items: d.extras, c: 'var(--s3)' },
             { k: 'sent', label: '기타 이체', won: t.sentSum, items: d.sent, c: 'var(--s4)' }].filter(function (g) { return g.k !== 'sent' || g.won || g.items.length; }),
    incomeSum: t.income, spend: t.spend, net: t.net };
}
function tipOn(el) {
  var tip = document.getElementById('tip');
  el.addEventListener('pointermove', function (e) {
    var t = e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; }
    tip.textContent = t.getAttribute('data-tip'); tip.hidden = false;
    var x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  });
  el.addEventListener('pointerleave', function () { tip.hidden = true; });
}
// Waterfall: income steps up, each spending group steps down, the last bar is the result.
function waterfall(m) {
  var steps = [];
  var run = 0;
  m.income.forEach(function (x) { steps.push({ label: x.name, from: run, to: run + x.won, c: 'var(--gain)' }); run += x.won; });
  steps.push({ label: '번 돈', from: 0, to: run, c: 'var(--ink-3)', total: true });
  m.groups.forEach(function (g) { if (!g.won) return; steps.push({ label: g.label, from: run, to: run - g.won, c: g.c }); run -= g.won; });
  steps.push({ label: '순이익', from: 0, to: run, c: run >= 0 ? 'var(--gain)' : 'var(--loss)', total: true });
  var vals = steps.reduce(function (a, s) { return a.concat([s.from, s.to]); }, [0]);
  var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  var W = 640, H = 260, L = 8, R = 8, T = 22, B = 46, n = steps.length, slot = (W - L - R) / n, bw = Math.min(54, slot * 0.62);
  var y = function (v) { return T + (max - v) / (max - min || 1) * (H - T - B); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="수입에서 지출을 빼 순이익이 되는 흐름">';
  // zero line
  s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--rule)" stroke-width="1"/>';
  steps.forEach(function (st, i) {
    var x = L + slot * i + (slot - bw) / 2, top = y(Math.max(st.from, st.to)), h = Math.max(2, Math.abs(y(st.from) - y(st.to)));
    var delta = st.total ? st.to : st.to - st.from;
    s += '<g data-tip="' + esc(st.label) + ' ' + (st.total ? '' : (delta >= 0 ? '+' : '')) + won(delta) + '원">';
    s += '<rect x="' + (x - 6) + '" y="' + T + '" width="' + (bw + 12) + '" height="' + (H - T - B) + '" fill="transparent"/>';
    s += '<rect x="' + x + '" y="' + top + '" width="' + bw + '" height="' + h + '" rx="3" fill="' + st.c + '"' + (st.total ? '' : ' opacity=".9"') + '/>';
    if (i < n - 1 && !steps[i + 1].total) s += '<line x1="' + (x + bw) + '" x2="' + (x + slot) + '" y1="' + y(st.to) + '" y2="' + y(st.to) + '" stroke="var(--ink-3)" stroke-dasharray="2 3" stroke-width="1"/>';
    s += '<text x="' + (x + bw / 2) + '" y="' + (top - 7) + '" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">' + (st.total || delta < 0 ? '' : '+') + man(delta) + '</text>';
    var words = st.label.length > 5 ? st.label.split(' ') : [st.label];
    var l1 = words.length > 1 ? words.slice(0, Math.ceil(words.length / 2)).join(' ') : st.label, l2 = words.length > 1 ? words.slice(Math.ceil(words.length / 2)).join(' ') : '';
    s += '<text x="' + (x + bw / 2) + '" y="' + (H - B + 16) + '" text-anchor="middle" font-size="12" fill="var(--ink-2)"' + (st.total ? ' font-weight="700"' : '') + '>' + esc(l1) + '</text>';
    if (l2) s += '<text x="' + (x + bw / 2) + '" y="' + (H - B + 30) + '" text-anchor="middle" font-size="12" fill="var(--ink-2)">' + esc(l2) + '</text>';
    s += '</g>';
  });
  return s + '</svg>';
}
// Month-by-month net result for the months already loaded.
function trend() {
  var ms = months().filter(function (k) { return state.data[k]; });
  if (ms.length < 2) return '';
  var rows = ms.map(function (k) { var m = model(state.data[k]); return { k: k, inc: m.incomeSum, out: m.spend, net: m.net }; });
  var max = Math.max.apply(null, rows.map(function (r) { return Math.max(r.inc, r.out); })) || 1;
  var minNet = Math.min(0, Math.min.apply(null, rows.map(function (r) { return r.net; })));
  var W = 1000, H = 170, L = 8, R = 8, T = 20, B = 30, slot = (W - L - R) / rows.length, bw = Math.min(40, slot * 0.28);
  var y = function (v) { return T + (max - v) / (max - minNet || 1) * (H - T - B); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="월별 번 돈과 나간 돈">';
  s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--rule)"/>';
  rows.forEach(function (r, i) {
    var cx = L + slot * i + slot / 2;
    [[r.inc, 'var(--gain)', '번 돈'], [r.out, 'var(--loss)', '나간 돈']].forEach(function (b, j) {
      var x = cx - bw - 1 + j * (bw + 2);
      s += '<g data-tip="' + Number(r.k.slice(5)) + '월 ' + b[2] + ' ' + won(b[0]) + '원"><rect x="' + x + '" y="' + y(b[0]) + '" width="' + bw + '" height="' + Math.max(1, y(0) - y(b[0])) + '" rx="3" fill="' + b[1] + '" opacity=".85"/></g>';
    });
    s += '<text x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink-2)">' + Number(r.k.slice(5)) + '월 ' + (r.net >= 0 ? '+' : '') + man(r.net) + '</text>';
  });
  return '<div class="sheet"><h2>월별 흐름</h2>' + s + '</svg><div class="legend"><span><i style="background:var(--gain)"></i>번 돈</span><span><i style="background:var(--loss)"></i>나간 돈</span></div></div>';
}
function barList(items, color, max) {
  return '<div class="bars">' + items.map(function (x) {
    var w = x.won ? Math.max(1, Math.abs(x.won) / max * 100) : 0;
    var chip = x.status === '예정' ? ' <span class="chip plan">예정</span>' : (x.status === '자동' ? ' <span class="chip auto">문자</span>' : '');
    if (x.won < 0) chip += ' <span class="chip cancel">취소</span>';
    return '<div class="bar" data-tip="' + esc(x.name) + ' ' + (x.won == null ? '금액 확인 필요' : won(x.won) + '원' + (x.usd ? ' ($' + x.usd + ')' : '')) + '"><div class="lbl">' + esc(x.name) + chip + (x.date ? '<em>' + esc(x.date) + '</em>' : '') + '</div>' +
      '<div class="val num">' + (x.won == null ? '<span style="color:var(--warn)">?</span>' : (Math.abs(x.won) >= 10000 ? man(x.won) : won(x.won)) + '원') + '</div>' +
      '<div class="track"><i style="width:' + w + '%;background:' + color + (x.status === '예정' ? ';opacity:.4' : '') + '"></i></div></div>';
  }).join('') + '</div>';
}
function render() {
  var r = state.data[state.month]; if (!r) return;
  var m = model(r), staff = m.staff, mo = Number(m.month.slice(5));
  document.body.className = staff ? 'staff' : 'admin';
  document.title = mo + '월 정산' + (staff ? '' : ' (사장님)');
  var spendTotal = m.groups.reduce(function (a, g) { return a + g.won; }, 0) || 1;
  var html = '';
  html += '<header class="top"><div><div class="eyebrow">' + (staff ? '팀 공유용' : '사장님 전용 · 모든 항목 공개') + '</div><h1>' + m.month.slice(0, 4) + '년 ' + mo + '월 정산</h1></div>' +
    '<div class="controls"><div class="months" role="group" aria-label="달 선택">' + months().map(function (k) { return '<button type="button" data-m="' + k + '" aria-pressed="' + (k === state.month) + '">' + Number(k.slice(5)) + '월</button>'; }).join('') + '</div>' +
    '<div class="live" id="live"><i></i>' + m.asOf + ' 기준 · 1분마다 갱신</div></div></header>';
  // Summary: one headline, two numbers, one picture.
  html += '<section class="sheet band"><div><div class="netlabel">' + mo + '월은</div><div class="net num ' + (m.net >= 0 ? 'pos' : 'neg') + '">' + man(Math.abs(m.net)) + '원 ' + (m.net >= 0 ? '흑자' : '적자') + '</div>' +
    '<div class="pair"><div class="in"><small>번 돈</small><b class="num">' + man(m.incomeSum) + '원</b></div><div class="out"><small>나간 돈</small><b class="num">' + man(m.spend) + '원</b></div></div>' +
    '<div style="margin-top:18px"><svg viewBox="0 0 100 6" preserveAspectRatio="none" width="100%" height="14" role="img" aria-label="나간 돈 구성">' +
    (function () { var x = 0; return m.groups.filter(function (g) { return g.won > 0; }).map(function (g) { var w = g.won / spendTotal * 100; var r = '<g data-tip="' + esc(g.label) + ' ' + won(g.won) + '원"><rect x="' + x + '" y="0" width="' + Math.max(0, w - 0.5) + '" height="6" rx="1" fill="' + g.c + '"/></g>'; x += w; return r; }).join(''); })() +
    '</svg><div class="legend">' + m.groups.filter(function (g) { return g.won > 0; }).map(function (g) { return '<span><i style="background:' + g.c + '"></i>' + esc(g.label) + ' <b class="num">' + man(g.won) + '</b></span>'; }).join('') + '</div></div>' +
    '</div><div><p class="chart-title">번 돈에서 나간 돈을 빼면</p>' + waterfall(m) + '</div></section>';
  html += trend();
  // Everything below is folded so the first screen stays simple.
  var max = 1; m.groups.forEach(function (g) { g.items.forEach(function (x) { max = Math.max(max, Math.abs(x.won || 0)); }); });
  html += '<details class="sheet fold"><summary>항목별로 보기</summary><div class="grid2" style="margin-top:14px">';
  m.groups.forEach(function (g) {
    if (staff && g.k === 'team') { html += '<section><h2>' + g.label + ' <span class="num">' + man(g.won) + '원</span></h2></section>'; return; }
    var items = g.items.slice().sort(function (a, b) { return (b.won || 0) - (a.won || 0); });
    html += '<section><h2>' + g.label + ' <span class="num">' + man(g.won) + '원</span></h2>' + (items.length ? barList(items, g.c, max) : '') + '</section>';
  });
  html += '</div></details>';
  html += '<details class="sheet fold"><summary>받은 돈 보기 · ' + man(m.depositsTotal) + '원</summary><div class="tbl" style="margin-top:12px">';
  if (staff) {
    html += '<table>' + m.deposits.map(function (x) { return '<tr><td>' + esc(x.name) + '</td><td class="r num">' + man(x.won) + '원</td></tr>'; }).join('') + '</table><p class="note">광고비가 포함된 금액이라 전부 수익은 아닙니다.</p>';
  } else {
    var d = m.raw;
    html += '<table><tr><th>광고주</th><th class="r">광고비</th><th class="r">수수료</th><th class="r">부가세</th></tr>' +
      d.deposits.map(function (x) { return '<tr><td>' + esc(x.name) + '</td><td class="r num">' + man(x.won) + '</td><td class="r num">' + man(x.fee) + '</td><td class="r num">' + man(x.vat) + '</td></tr>'; }).join('') +
      '</table><p class="note">더윤 광고비 차익 ' + man(d.margin.margin) + '원 = 리포트 광고비 ' + man(d.margin.rep) + ' − 실제 ' + man(d.margin.real) + ' · 선입금 남은 광고비 ' + man(d.prepaid.remain) + '원</p>';
  }
  html += '</div></details>';
  if (!staff) html += adminTools(m.raw);
  html += '<p class="note">만원 단위로 반올림했습니다. 막대에 손을 올리면 정확한 금액이 보입니다.</p>';
  var app = document.getElementById('app'), open = Array.prototype.map.call(app.querySelectorAll('details.fold'), function (x) { return x.open; });
  app.innerHTML = html; app.classList.remove('loading');
  Array.prototype.forEach.call(app.querySelectorAll('details.fold'), function (x, i) { if (open[i]) x.open = true; });
}
function adminTools(d) {
  var h = '<details class="sheet fold"><summary>관리 · 직접 추가 · 휴대폰 연동</summary><div style="display:grid;gap:16px;margin-top:14px">';
  if (d.unknown.length) h += '<div class="warnbox">금액을 모르는 항목: ' + d.unknown.map(esc).join(', ') + '. 시트에 금액을 넣으면 합계에 들어갑니다.</div>';
  if (d.received.length) h += '<section><h2>문자로 들어온 입금 (합계에 넣지 않음)</h2><div class="tbl"><table>' + d.received.map(function (x) { return '<tr><td>' + esc(x.date) + '</td><td>' + esc(x.name) + '</td><td class="r num">' + won(x.won) + '원</td></tr>'; }).join('') + '</table></div><p class="note">광고주 선입금이면 Claude에게 알려 주세요. 수입으로 옮깁니다.</p></section>';
  h += '<section><h2>보낸 돈 · 결제 직접 추가</h2><form class="add" id="addForm">' +
    '<label for="fDate">날짜<input id="fDate" placeholder="11/15" required></label>' +
    '<label for="fName" class="wide">받는 사람 / 내용<input id="fName" placeholder="예: 우진님 12월분" required></label>' +
    '<label for="fAmt">금액 (원)<input id="fAmt" inputmode="numeric" placeholder="1,000,000" required></label>' +
    '<label for="fKind">구분<select id="fKind"><option value="팀">사람에게 지급</option><option value="이체">기타 이체</option><option value="추가">추가 결제</option><option value="구독">구독</option><option value="입금">광고주 입금</option></select></label>' +
    '<button class="primary" type="submit" id="fBtn">추가</button></form><p class="note" id="fMsg">계좌이체처럼 문자가 안 오는 돈은 여기서 넣어 주세요. 고치거나 지울 때는 <a href="' + esc(d.sheet) + '" target="_blank" rel="noopener">정산 시트</a>에서 하면 됩니다.</p></section>';
  if (d.staffToken) {
    var base = location.origin + location.pathname;
    h += '<section><h2>링크와 휴대폰 연동</h2>' +
      '<div class="copyrow"><span>직원 발표용</span><code>' + esc(base + '#k=' + d.staffToken) + '</code><button class="ghost" type="button" data-copy="' + esc(base + '#k=' + d.staffToken) + '">복사</button></div>' +
      '<p class="note">휴대폰 문자 연동 (아이폰 단축어 → 자동화 → 메시지 → 내용에 "원" 포함 → 즉시 실행 → "URL의 콘텐츠 가져오기")</p>' +
      '<div class="copyrow"><span>URL</span><code>' + esc(API) + '</code><button class="ghost" type="button" data-copy="' + esc(API) + '">복사</button></div>' +
      '<div class="copyrow"><span>방법</span><code>POST · 요청 본문: 양식</code><span></span></div>' +
      '<div class="copyrow"><span>api</span><code>paylog</code><button class="ghost" type="button" data-copy="paylog">복사</button></div>' +
      '<div class="copyrow"><span>v</span><code>' + esc(d.paylogToken) + '</code><button class="ghost" type="button" data-copy="' + esc(d.paylogToken) + '">복사</button></div>' +
      '<div class="copyrow"><span>text</span><code>단축어 입력 (메시지 내용)</code><span></span></div></section>';
  }
  return h + '</div></details>';
}
function load(month, quiet) {
  state.month = month;
  if (!quiet) document.getElementById('app').classList.add('loading');
  return api('&month=' + month + (state.role !== 'staff' && !state.links ? '&links=1' : '')).then(function (r) {
    if (!r.ok) { document.getElementById('app').innerHTML = '<div class="gate">이 링크로는 정산을 볼 수 없습니다. 받은 링크 전체를 다시 열어 주세요.</div>'; return; }
    state.role = r.role; if (r.data.staffToken) state.links = { staffToken: r.data.staffToken, paylogToken: r.data.paylogToken };
    if (r.role === 'admin' && state.links) { r.data.staffToken = state.links.staffToken; r.data.paylogToken = state.links.paylogToken; }
    state.data[month] = r; state.at = Date.now();
    render();
  }).catch(function () { var l = document.getElementById('live'); if (l) { l.classList.add('stale'); l.lastChild.textContent = ' 연결이 끊겨 잠시 후 다시 시도합니다'; } });
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-m]'); if (b) { var k = b.getAttribute('data-m'); if (state.data[k]) { state.month = k; render(); } load(k, !!state.data[k]); return; }
  var c = e.target.closest('[data-copy]');
  if (c) { var v = c.getAttribute('data-copy'); navigator.clipboard.writeText(v).then(function () { c.textContent = '복사됨'; }, function () { c.textContent = '길게 눌러 복사'; }); }
});
document.addEventListener('submit', function (e) {
  if (e.target.id !== 'addForm') return; e.preventDefault();
  var amt = Number(document.getElementById('fAmt').value.replace(/[^\d]/g, '')), btn = document.getElementById('fBtn'), msg = document.getElementById('fMsg');
  if (!amt) { msg.textContent = '금액을 숫자로 넣어 주세요.'; return; }
  var kind = document.getElementById('fKind').value;
  var row = [state.month, kind, document.getElementById('fDate').value.trim(), document.getElementById('fName').value.trim(), amt, '', '', '', '정산 화면에서 추가', '', '', '확정'];
  btn.disabled = true; btn.textContent = '추가 중…';
  api('&rows=' + encodeURIComponent(JSON.stringify([row]))).then(function (r) {
    btn.disabled = false; btn.textContent = '추가';
    if (!r.ok) { msg.textContent = '추가하지 못했습니다: ' + r.error; return; }
    load(state.month, true);
  }).catch(function () { btn.disabled = false; btn.textContent = '추가'; msg.textContent = '연결이 끊겨 추가하지 못했습니다. 다시 눌러 주세요.'; });
});
tipOn(document.body);
if (!KEY) document.getElementById('app').innerHTML = '<div class="gate">정산 링크에 접근 키가 없습니다. 받은 링크 전체를 열어 주세요.</div>';
else {
  var ms = months(), cur = ms[ms.length - 1];
  load(cur).then(function () { ms.slice(0, -1).forEach(function (k) { api('&month=' + k).then(function (r) { if (r.ok) { state.data[k] = r; render(); } }); }); });
  setInterval(function () { var a = document.activeElement; if (!document.hidden && !(a && a.closest && a.closest('form'))) load(state.month, true); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - state.at > 30000) load(state.month, true); });
}
</script>
</body></html>
