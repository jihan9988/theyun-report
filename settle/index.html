<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>잠금</title>
<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#191f28;--ink2:#6b7684;--line:#e5e8eb;--blue:#3182f6;--red:#f04452;
  --f:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#101318;--card:#1b1f26;--ink:#eef1f5;--ink2:#9aa4b2;--line:#2a3039;--blue:#4d94ff;--red:#ff6470}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border-radius:22px;padding:32px 24px;width:100%;max-width:360px;text-align:center}
.lockic{width:48px;height:48px;margin:0 auto 12px;border-radius:16px;background:var(--bg);display:grid;place-items:center}
h1{font-size:20px;margin:0 0 6px}
p{margin:0 0 18px;color:var(--ink2);font-size:14px}
input{width:100%;font:700 22px var(--f);letter-spacing:.3em;text-align:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:10px}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
button{width:100%;border:0;border-radius:14px;padding:14px;font:700 16px var(--f);background:var(--blue);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
.msg{min-height:22px;font-size:14px;color:var(--red);margin-top:12px}
</style></head>
<body>
<div class="box">
  <div class="lockic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1 id="ttl">확인하는 중…</h1>
  <p id="sub"></p>
  <form id="f" hidden>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호" aria-label="비밀번호">
    <input id="pin2" type="password" inputmode="numeric" autocomplete="off" placeholder="한 번 더" aria-label="비밀번호 확인" hidden>
    <button id="go" type="submit">열기</button>
  </form>
  <div class="msg" id="msg" role="alert"></div>
</div>
<script>
// Lock screen only. This file holds no data and no keys; the page itself arrives from the server after the PIN.
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbxcDlpSAjeZ5M0-CAH3cxW7B_xkXASHOGtLPvw0mD_sLq8BuhNsg9qK1E4WsgI-7uYBdg/exec';
  var PAGE = new URLSearchParams(location.search).get('page') || 'settle';
  var SKEY = 'owner_s', origFetch = window.fetch.bind(window), mode = 'unlock';
  var $ = function (id) { return document.getElementById(id); };
  var SHARE = PAGE === 'settle-staff' ? ((location.hash.match(/k=([A-Za-z0-9]+)/) || [])[1] || '') : '';
  // Old owner bookmarks carried a key after '#'; drop it. The meeting share link keeps its key so a reload still works.
  if (location.hash && !SHARE) history.replaceState(null, '', location.pathname + location.search);
  function post(body) {
    return origFetch(API, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer' })
      .then(function (r) { return r.json(); });
  }
  function getS() { try { return sessionStorage.getItem(SKEY) || ''; } catch (e) { return ''; } }
  function setS(s) { try { if (s) sessionStorage.setItem(SKEY, s); else sessionStorage.removeItem(SKEY); } catch (e) {} }
  function gateText(g) {
    g = String(g || '');
    if (g === 'HARDLOCK') return '비밀번호가 너무 많이 틀려서 완전히 잠겼어요. Claude에게 잠금을 풀어 달라고 말해 주세요.';
    if (g.indexOf('LOCKED') === 0) return '비밀번호가 여러 번 틀렸어요. ' + (g.split(':')[1] || '30') + '분 뒤에 다시 해 주세요.';
    if (g.indexOf('WRONG') === 0) return '비밀번호가 달라요. ' + g.split(':')[1] + '번 더 틀리면 30분 동안 잠겨요.';
    if (g === 'FORMAT') return '숫자 6~12자리로 정해 주세요.';
    if (g === 'SETUP_CLOSED') return '처음 설정이 닫혀 있어요. Claude에게 다시 열어 달라고 말해 주세요.';
    return '열지 못했어요. 다시 해 주세요.';
  }
  function show(title, sub, form) {
    $('ttl').textContent = title; $('sub').textContent = sub || '';
    $('f').hidden = !form; $('pin2').hidden = mode !== 'setup';
    $('go').textContent = mode === 'setup' ? '비밀번호 정하기' : '열기';
    if (form) setTimeout(function () { $('pin').focus(); }, 50);
  }
  // Runs inside the opened page: routes its API calls through the session, adds a menu/lock bar.
  function shim(O) {
    window.__ownerPost = post;
    window.fetch = function (input, init) {
      var url = String(input && input.url || input), i = url.indexOf('?'), base = i < 0 ? url : url.slice(0, i);
      var target = O.targets[base];
      if (!target) return origFetch(input, init);
      var req = { api: 'ownerapi', target: target, query: i < 0 ? '' : url.slice(i + 1) };
      if (SHARE) req.k = SHARE; else req.s = getS();
      return post(req).then(function (r) {
        if (r && r.error === 'SESSION') { setS(''); location.reload(); }
        return new Response(JSON.stringify(r), { status: 200, headers: { 'Content-Type': 'application/json' } });
      });
    };
    if (SHARE) return;
    document.addEventListener('DOMContentLoaded', function () {
      var bar = document.createElement('div');
      bar.setAttribute('style', 'position:fixed;right:12px;bottom:12px;z-index:99999;display:flex;gap:6px;font:700 13px -apple-system,sans-serif');
      var css = 'background:#191f28;color:#fff;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25);font:inherit';
      bar.innerHTML = '<a href="' + O.home + '?page=home" style="' + css + '">메뉴</a><button type="button" style="' + css + '">잠그기</button>';
      bar.querySelector('button').addEventListener('click', function () {
        post({ api: 'ownerlock', s: getS() }).catch(function () {}).then(function () { setS(''); location.reload(); });
      });
      document.body.appendChild(bar);
    });
  }
  function open_(s) {
    show('여는 중…', '', false);
    post({ api: 'ownerpage', s: s, page: PAGE }).then(function (r) {
      if (!r.ok) { if (r.error === 'SESSION') { setS(''); start(); } else show('열지 못했어요', '잠시 뒤 새로고침해 주세요.', false); return; }
      window.__OWNER = r.cfg;
      shim(r.cfg);
      document.open(); document.write(r.html); document.close();
    }).catch(function () { show('연결하지 못했어요', '잠시 뒤 새로고침해 주세요.', false); });
  }
  function openShared() {
    show('여는 중…', '', false);
    post({ api: 'ownerpage', k: SHARE }).then(function (r) {
      if (!r.ok) { show('열 수 없는 링크예요', '받은 링크 전체를 다시 열어 주세요.', false); return; }
      window.__OWNER = r.cfg; shim(r.cfg);
      document.open(); document.write(r.html); document.close();
    }).catch(function () { show('연결하지 못했어요', '잠시 뒤 새로고침해 주세요.', false); });
  }
  function start() {
    if (SHARE) return openShared();
    var s = getS();
    if (s) return open_(s);
    post({ api: 'ownerstatus' }).then(function (st) {
      if (st.gate) { show('잠겨 있어요', gateText(st.gate), false); return; }
      if (!st.pinSet && st.setupOpen) { mode = 'setup'; show('비밀번호 정하기', '대표님만 아는 숫자 6~12자리로 정해 주세요. 이 화면을 새 탭에서 열 때마다 물어봐요.', true); return; }
      if (!st.pinSet) { show('아직 준비 중이에요', 'Claude에게 처음 설정을 열어 달라고 말해 주세요.', false); return; }
      mode = 'unlock'; show('대표님 전용', '비밀번호를 넣어 주세요.', true);
    }).catch(function () { show('연결하지 못했어요', '잠시 뒤 새로고침해 주세요.', false); });
  }
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var a = $('pin').value.trim(), b = $('pin2').value.trim();
    $('msg').textContent = '';
    if (mode === 'setup' && a !== b) { $('msg').textContent = '두 번 넣은 숫자가 달라요.'; return; }
    $('go').disabled = true;
    post(mode === 'setup' ? { api: 'ownersetpin', pin: a } : { api: 'ownerunlock', pin: a }).then(function (r) {
      $('go').disabled = false; $('pin').value = ''; $('pin2').value = '';
      if (r.ok) { setS(r.session); open_(r.session); return; }
      if (r.error === 'HARDLOCK' || String(r.error).indexOf('LOCKED') === 0) { show('잠겨 있어요', gateText(r.error), false); return; }
      $('msg').textContent = gateText(r.error);
    }).catch(function () { $('go').disabled = false; $('msg').textContent = '연결이 끊겼어요. 다시 해 주세요.'; });
  });
  start();
})();
</script>
</body></html>
